name: Scrape Flyers

on:
  schedule:
    # Codziennie o 5:00 UTC — ceny w gazetkach obu sklepów mają być
    # aktualizowane co dzień, nie tylko raz w tygodniu.
    - cron: '0 5 * * *'
  workflow_dispatch:  # ręczne odpalenie z GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_DEBUG: '1'
        run: python run_all.py

      - name: Upload debug dumps (surowe odpowiedzi sklepów)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-${{ github.run_id }}
          path: scrapers/debug_*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        run: |
          echo "Scraper failed at $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Check Supabase error_logs table for details" >> $GITHUB_STEP_SUMMARY
