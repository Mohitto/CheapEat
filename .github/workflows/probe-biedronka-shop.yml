name: Probe Biedronka Shop

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Tesseract OCR (pol)
        run: |
          # Obrazy runnerów mają doklejone repozytoria firm trzecich (Chrome),
          # które potrafią serwować nieaktualny indeks i wywalić apt-get update
          # na niezgodności sumy kontrolnej — co nie ma nic wspólnego z
          # pakietami, których potrzebujemy. Nie zależymy od nich, więc precz.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-pol

      - name: Probe flyer page layout (word boxes vs prices)
        env:
          PYTHONUNBUFFERED: '1'
        run: python probe_flyer_layout.py
