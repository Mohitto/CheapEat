name: Probe Biedronka Shop

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run probe
        env:
          PYTHONUNBUFFERED: '1'
        run: python probe_biedronka_shop.py

      - name: Run zakupy.biedronka.pl probe
        env:
          PYTHONUNBUFFERED: '1'
        run: python probe_biedronka_zakupy.py

      - name: Probe real category pages (mleko, jaja, masło)
        env:
          PYTHONUNBUFFERED: '1'
        run: python probe_biedronka_category.py

      - name: Probe exact product tile HTML structure
        env:
          PYTHONUNBUFFERED: '1'
        run: python probe_biedronka_tile.py
