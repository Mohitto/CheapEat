name: Verify Recipe Cost

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Tesseract OCR (pol)
        run: |
          # Obrazy runnerów mają doklejone repozytoria firm trzecich (Chrome),
          # które potrafią serwować nieaktualny indeks i wywalić apt-get update
          # na niezgodności sumy kontrolnej — co nie ma nic wspólnego z
          # pakietami, których potrzebujemy. Nie zależymy od nich, więc precz.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-pol

      - name: Purge bad/stale price rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python cleanup_bad_mappings.py

      - name: Re-seed test recipes (egg units in pieces)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python seed_dev_data.py

      - name: Re-run all scrapers with unit-aware packages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPER_DEBUG: '1'
          PYTHONUNBUFFERED: '1'
        run: python run_all.py

      - name: Compute recipe cost from real Supabase data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python verify_recipe_cost.py

      - name: Dump full price/mapping state per ingredient
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python diagnose_prices.py
