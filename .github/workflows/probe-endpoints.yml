name: Probe Store Endpoints

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Probe endpoints
        run: python probe_endpoints.py

      - name: Probe Biedronka leaflet API
        run: python probe_biedronka_leaflet_api.py

      - name: Probe Biedronka UUID resolution
        run: python probe_biedronka_uuid.py

      - name: Install Tesseract OCR (pol)
        run: |
          # Obrazy runnerów mają doklejone repozytoria firm trzecich (Chrome),
          # które potrafią serwować nieaktualny indeks i wywalić apt-get update
          # na niezgodności sumy kontrolnej — co nie ma nic wspólnego z
          # pakietami, których potrzebujemy. Nie zależymy od nich, więc precz.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-pol

      - name: Probe Biedronka OCR feasibility
        run: python probe_biedronka_ocr.py

      - name: Upload test flyer page images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biedronka-test-pages
          path: scrapers/test_page_*.png
          if-no-files-found: ignore
          retention-days: 7
